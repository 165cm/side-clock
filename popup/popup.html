<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Side Clock</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🕐</div>
    <div>
      <div class="logo-title">Side Clock</div>
      <div class="logo-sub" data-i18n="appSub"></div>
    </div>
  </div>
  <label class="toggle" title="Enable / 有効">
    <input type="checkbox" id="enabled">
    <span class="slider"></span>
  </label>
</header>

<div id="reload-notice" class="reload-notice" data-i18n="reloadNotice" style="display:none"></div>

<div class="section-label" data-i18n="sectionSite"></div>
<div class="row">
  <span class="site-host" id="current-host" title="">—</span>
  <label class="toggle" title="Show on this site">
    <input type="checkbox" id="site-toggle">
    <span class="slider"></span>
  </label>
</div>

<div class="section-label" data-i18n="sectionWeather"></div>
<div class="row">
  <span data-i18n="weatherShow"></span>
  <label class="toggle">
    <input type="checkbox" id="weather">
    <span class="slider"></span>
  </label>
</div>

<div id="weather-config">
  <div class="row">
    <span data-i18n="weatherCountry"></span>
    <select id="weather-country" class="select">
      <option value="JP">日本 (JP)</option>
      <option value="US">United States (US)</option>
      <option value="GB">United Kingdom (GB)</option>
      <option value="CA">Canada (CA)</option>
      <option value="AU">Australia (AU)</option>
      <option value="NZ">New Zealand (NZ)</option>
      <option value="DE">Deutschland (DE)</option>
      <option value="FR">France (FR)</option>
      <option value="ES">España (ES)</option>
      <option value="IT">Italia (IT)</option>
      <option value="NL">Nederland (NL)</option>
      <option value="BE">Belgique (BE)</option>
      <option value="CH">Schweiz (CH)</option>
      <option value="AT">Österreich (AT)</option>
      <option value="SE">Sverige (SE)</option>
      <option value="NO">Norge (NO)</option>
      <option value="DK">Danmark (DK)</option>
      <option value="FI">Suomi (FI)</option>
      <option value="PL">Polska (PL)</option>
      <option value="PT">Portugal (PT)</option>
      <option value="CZ">Česko (CZ)</option>
      <option value="IE">Ireland (IE)</option>
      <option value="IN">India (IN)</option>
      <option value="MY">Malaysia (MY)</option>
      <option value="PH">Philippines (PH)</option>
      <option value="TH">Thailand (TH)</option>
      <option value="BR">Brasil (BR)</option>
      <option value="MX">México (MX)</option>
      <option value="ZA">South Africa (ZA)</option>
      <option value="TR">Türkiye (TR)</option>
      <option value="RU">Россия (RU)</option>
    </select>
  </div>
  <div class="row" id="postal-row-jp">
    <span data-i18n="weatherPostal"></span>
    <span class="postal-jp">
      <span class="postal-mark">〒</span>
      <input id="postal-jp1" class="input postal-seg" type="text" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="100">
      <span class="postal-dash">–</span>
      <input id="postal-jp2" class="input postal-seg" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0001">
    </span>
  </div>
  <div class="row" id="postal-row-default">
    <span data-i18n="weatherPostal"></span>
    <input id="weather-postal" class="input" type="text" autocomplete="off" placeholder="10001">
  </div>
  <div class="row">
    <button id="weather-register" class="btn" data-i18n-btn="weatherRegister"></button>
  </div>
  <div id="weather-status" class="weather-status"></div>

  <div class="row" id="unit-row">
    <span data-i18n="unitLabel"></span>
    <div class="seg" id="unit-seg">
      <button data-unit="C">°C</button>
      <button data-unit="F">°F</button>
    </div>
  </div>
</div>

<div class="section-label" data-i18n="sectionClock"></div>
<div class="row">
  <span data-i18n="clockFormat"></span>
  <div class="seg" id="hour12-seg">
    <button data-h12="false" data-i18n-btn="format24h"></button>
    <button data-h12="true"  data-i18n-btn="formatAmPm"></button>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
